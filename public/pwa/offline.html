<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Offline – alle-noten.de</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #222222; --muted: #666666; --accent: #222222; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f2f2f2; --muted: #a0a0a0; --accent: #f2f2f2; --on-accent: #121212; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    main { max-width: 360px; }
    svg { width: 72px; height: 72px; fill: var(--fg); opacity: .85; }
    h1 { font-size: 1.4rem; margin: 20px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 600; padding: 12px 28px; border: 0; border-radius: 999px;
      background: var(--accent); color: var(--on-accent); cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <ellipse cx="210" cy="350" rx="62" ry="46" transform="rotate(-20 210 350)"/>
      <rect x="254" y="120" width="18" height="232"/>
      <path d="M254 120 C 262 176, 362 182, 348 276 C 340 232, 300 214, 272 212 Z"/>
    </svg>
    <h1>Keine Internetverbindung</h1>
    <p>Diese Seite kann gerade nicht geladen werden. Bitte die Verbindung prüfen – sobald das Gerät wieder online ist, geht es automatisch weiter.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
